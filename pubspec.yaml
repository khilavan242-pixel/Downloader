name: tapnab
description: One-tap MP3 / MP4 downloader for Android, powered by yt-dlp. Share a link, pick a quality, done.
publish_to: "none"
version: 1.4.0+5

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.2
  webview_flutter: ^4.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
